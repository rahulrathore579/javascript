<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Counter</title>
  <style>
   
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }

    h1 {
      font-size: 40px;
      color: #333;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    .colorDIV{
        width: 400px;
        height: 100px;
        background-color: lightgreen;
        margin: 20px auto;
        line-height: 100px;
        cursor: pointer;
        font-size: 20px;
    }
    #bgToggle{
        margin-left: 10px;
    }
  </style>
</head>
<body>

  <h1>Counter: <span id="count">0</span></h1>
  <button onclick="increaseCounter()">Increase</button>
  <div class="colorDIV" id = "colorDIV">Click to change The Color</div>

  <label for="bgToggle">Toggle Background Color</label>
  <input type="checkbox" id="bgToggle" onchange="toggleBg()">

  <script src="script.js"></script>

</body>
</html>


<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q3 - Task Manager</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>body{font-family:Arial;padding:20px}.task{padding:8px;border-bottom:1px solid #eee}</style>
</head>
<body>
  <h2>Task Manager</h2>
  <label>Sort/Filter:
    <select id="filter">
      <option value="">All</option>
      <option value="priority=Low">Low Priority</option>
      <option value="priority=Medium">Medium Priority</option>
      <option value="priority=High">High Priority</option>
      <option value="completed=true">Completed</option>
    </select>
  </label>
  <div id="tasks">Loading...</div>

<script>
function load(q){
  $('#tasks').text('Loading...');
  var url = '/tasks' + (q ? ('?'+q) : '');
  $.get(url).done(function(data){
    if(!data.length){ $('#tasks').text('No tasks found'); return; }
    $('#tasks').empty();
    data.forEach(function(t){
      var chk = $('<input type="checkbox">').prop('checked', t.completed).on('change', function(){
        $.ajax({url:'/tasks/'+t.id, method:'PATCH', contentType:'application/json', data: JSON.stringify({completed: this.checked})});
      });
      $('#tasks').append($('<div>').addClass('task').append(chk, ' ', $('<strong>').text(t.title), ' (', t.priority, ')'));
    });
  }).fail(function(){ $('#tasks').text('Error loading tasks')});
}

$('#filter').on('change', function(){
  load($(this).val());
});

load();
</script>
</body>
</html>

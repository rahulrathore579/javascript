
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Q4 - Multi-API Dashboard</title>
<style>body{font-family:Arial;padding:20px}.card{padding:12px;border:1px solid #ddd;margin:8px;display:inline-block;width:150px;text-align:center}</style>
</head>
<body>
  <h2>Multi-API Dashboard</h2>
  <div id="warning" style="color:orange;display:none">Some data could not be loaded.</div>
  <div id="container">
    <div class="card" id="users">Users<br><span class="val">—</span></div>
    <div class="card" id="orders">Orders<br><span class="val">—</span></div>
    <div class="card" id="products">Products<br><span class="val">—</span></div>
  </div>
<script>
function showSkeletons(){
  document.querySelectorAll('.val').forEach(function(v){ v.innerText='...'; });
}
showSkeletons();
Promise.all([fetch('/users'), fetch('/orders'), fetch('/products')]).then(function(res){
  return Promise.all(res.map(r=> r.ok ? r.json() : Promise.reject(r.status)));
}).then(function([users, orders, products]){
  document.querySelector('#users .val').innerText = users.length;
  document.querySelector('#orders .val').innerText = orders.length;
  document.querySelector('#products .val').innerText = products.length;
}).catch(function(err){
  document.querySelector('#warning').style.display='block';
  // try to load what is available
  fetch('/users').then(r=>r.ok?r.json():[]).then(d=>document.querySelector('#users .val').innerText=d.length).catch(()=>{});
  fetch('/orders').then(r=>r.ok?r.json():[]).then(d=>document.querySelector('#orders .val').innerText=d.length).catch(()=>{});
  fetch('/products').then(r=>r.ok?r.json():[]).then(d=>document.querySelector('#products .val').innerText=d.length).catch(()=>{});
});
</script>
</body>
</html>
